[org/gnome/desktop/background]
picture-options='zoom'
picture-uri='file://@HOME@/rices/gnome-macos/wallpaper/wallpaper.jpg'
picture-uri-dark='file://@HOME@/rices/gnome-macos/wallpaper/wallpaper.jpg'

[org/gnome/desktop/input-sources]
sources=[('xkb', 'fr')]

[org/gnome/desktop/interface]
accent-color='blue'
clock-show-date=true
clock-show-weekday=true
color-scheme='prefer-dark'
cursor-size=24
cursor-theme='WhiteSur-cursors'
document-font-name='Inter 11'
enable-hot-corners=false
font-antialiasing='rgba'
font-hinting='slight'
font-name='Inter 10.5'
gtk-theme='WhiteSur-Dark'
icon-theme='WhiteSur-dark'
monospace-font-name='JetBrainsMono Nerd Font 10.5'
show-battery-percentage=true

[org/gnome/desktop/notifications]

[org/gnome/desktop/screensaver]
picture-uri='file://@HOME@/rices/gnome-macos/wallpaper/wallpaper.jpg'

[org/gnome/desktop/sound]
event-sounds=true
theme-name='macos-glass'

[org/gnome/desktop/wm/keybindings]
switch-input-source=@as []
switch-input-source-backward=@as []

[org/gnome/desktop/wm/preferences]
button-layout='close,minimize,maximize:'
titlebar-font='Inter Semi-Bold 10.5'

[org/gnome/mutter]
center-new-windows=true

[org/gnome/nautilus/preferences]
migrated-gtk-settings=true

[org/gnome/shell]
disable-user-extensions=false
disabled-extensions=@as []
enabled-extensions=['user-theme@gnome-shell-extensions.gcampax.github.com', 'search-light@icedman.github.com', 'logomenu@aryan_k', 'openweather-extension@penguin-teal.github.io', 'mediacontrols@cliffniff.github.com', 'quick-settings-tweaks@qwreey', 'blur-my-shell@aunetx', 'standby-glass@gnome-macos', 'compiz-alike-magic-lamp-effect@hermes83.github.com', 'rounded-window-corners@fxgn', 'dash-to-dock@micxgx.gmail.com']
favorite-apps=['brave-browser.desktop', 'discord.desktop', 'org.gnome.Nautilus.desktop', 'spotify-launcher.desktop', 'gnome-macos-ghostty.desktop']

[org/gnome/shell/extensions/Logo-menu]
menu-button-icon-image=0
symbolic-icon=true
use-custom-icon=false

[org/gnome/shell/extensions/blur-my-shell]
pipelines={'pipeline_default': {'name': <'Default'>, 'effects': <[<{'type': <'dual_kawase_blur'>, 'id': <'effect_000000000000'>, 'params': <{'unscaled_radius': <30>, 'brightness': <0.59999999999999998>}>}>]>}, 'pipeline_liquid_glass': {'name': <'Liquid Glass'>, 'effects': <[<{'type': <'luminosity'>, 'id': <'effect_liquid_glass_luminosity'>, 'params': <{'saturation_multiplicator': <1.1000000000000001>}>}>, <{'type': <'refraction'>, 'id': <'effect_liquid_glass_refraction'>, 'params': <{'tint': <0>}>}>, <{'type': <'noise'>, 'id': <'effect_liquid_glass_noise'>, 'params': <{'noise': <0.10000000000000001>}>}>]>}, 'pipeline_vapor_glass': {'name': <'Vapor Glass'>, 'effects': <[<{'type': <'luminosity'>, 'id': <'effect_vapor_glass_luminosity'>, 'params': <{'saturation_multiplicator': <1.1000000000000001>}>}>, <{'type': <'wave'>, 'id': <'effect_vapor_glass_wave'>, 'params': <@a{sv} {}>}>, <{'type': <'refraction'>, 'id': <'effect_vapor_glass_refraction'>, 'params': <{'tint': <0>}>}>, <{'type': <'noise'>, 'id': <'effect_vapor_glass_noise'>, 'params': <{'noise': <0.10000000000000001>}>}>]>}, 'pipeline_classic_light_background': {'name': <'Classic Light Background'>, 'effects': <[<{'type': <'dual_kawase_blur'>, 'id': <'effect_classic_light_blur'>, 'params': <{'unscaled_radius': <30>, 'brightness': <0.84999999999999998>}>}>, <{'type': <'color'>, 'id': <'effect_classic_light_color'>, 'params': <{'color': <(1.0, 1.0, 1.0, 0.34999999999999998)>, 'blend_mode': <17>}>}>]>}, 'pipeline_classic_dark_background': {'name': <'Classic Dark Background'>, 'effects': <[<{'type': <'dual_kawase_blur'>, 'id': <'effect_classic_dark_blur'>, 'params': <{'unscaled_radius': <30>, 'brightness': <0.59999999999999998>}>}>, <{'type': <'color'>, 'id': <'effect_classic_dark_color'>, 'params': <{'color': <(0.40000000000000002, 0.40000000000000002, 0.40000000000000002, 0.34999999999999998)>, 'blend_mode': <17>}>}>]>}, 'pipeline_migrated_dynamic_blur': {'name': <'Migrated dynamic blur'>, 'effects': <[<{'type': <'