settings-version=8

[org/gnome/shell/extensions/blur-my-shell/appfolder]
blur=true
pipeline='pipeline_classic_light_background'
style-dialogs=1

[org/gnome/shell/extensions/blur-my-shell/applications]
blacklist=['Plank', 'com.desktop.ding', 'Conky']
blur=true
blur-on-overview=true
dynamic-opacity=false
enable-all=true
opacity=200
pipeline='pipeline_classic_light_background'
sigma=40
unblur-when-fullscreen=true
whitelist=@as []

[org/gnome/shell/extensions/blur-my-shell/dash-to-dock]
blur=true
override-background=true
pipeline='pipeline_classic_light_background'
static-blur=true
style-dash-to-dock=0

[org/gnome/shell/extensions/blur-my-shell/lockscreen]
blur=true
pipeline='pipeline_classic_light_background'

[org/gnome/shell/extensions/blur-my-shell/overview]
blur=true
pipeline='pipeline_overview_soft'
style-components=1

[org/gnome/shell/extensions/blur-my-shell/panel]
blur=true
override-background=true
pipeline='pipeline_classic_light_background'
static-blur=true
style-panel=0

[org/gnome/shell/extensions/blur-my-shell/popup]
blur=true
calendar-corner-radius=28
menu-corner-radius=28
pipeline='pipeline_classic_light_background'
quick-settings-corner-radius=33

[org/gnome/shell/extensions/dash-to-dock]
apply-custom-theme=false
autohide=true
background-color='rgb(20,18,36)'
background-opacity=0.29999999999999999
click-action='minimize-or-previews'
custom-background-color=true
custom-theme-shrink=true
dash-max-icon-size=56
dock-fixed=false
dock-position='BOTTOM'
extend-height=false
height-fraction=0.90000000000000002
icon-size-fixed=true
intellihide=true
intellihide-mode='FOCUS_APPLICATION_WINDOWS'
multi-monitor=false
running-indicator-style='DOTS'
scroll-action='cycle-windows'
show-apps-at-top=false
show-icons-emblems=true
show-icons-notifications-counter=true
show-mounts=false
show-show-apps-button=true
show-trash=true
transparency-mode='FIXED'

[org/gnome/shell/extensions/mediacontrols]
extension-position='Right'

[org/gnome/shell/extensions/openweather-refined]
position-in-panel='right'
unit='celsius'

[org/gnome/shell/extensions/search-light]
background-color=(1.0, 1.0, 1.0, 0.22)
blur-background=true
blur-brightness=0.84999999999999998
blur-sigma=40.0
border-radius=7.0
scale-height=0.5
scale-width=0.35999999999999999
shortcut-search=['<Super>space']
show-panel-icon=false

[org/gnome/shell/extensions/user-theme]
name='WhiteSur-Dark'

[org/gnome/shell/keybindings]
show-screenshot-ui=['Print', '<Super><Shift>s']

